# Weekly dependency update PRs; CI tests each one before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
      app:
        dependency-type: production
    # Expo pins exact versions of React, React Native and its own modules per SDK.
    # Upgrade those together, deliberately, with:  npx expo install --fix
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@types/react"
      - dependency-name: "@expo/*"
      # Major versions of these break eslint-config-expo (typescript-eslint and
      # eslint-plugin-react don't support them yet). Revisit with each Expo SDK.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
