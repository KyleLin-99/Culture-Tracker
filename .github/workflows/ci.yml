# Regression tests. Runs on every pull request, every push to main, once a day,
# and on demand (Actions tab > CI > Run workflow). The daily run catches breakage
# from outside the repo (dependency releases, Supabase images) in quiet weeks.
# GitHub emails you when a scheduled run fails.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * *" # daily, 09:41 UTC (4:41 am Eastern)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fresh local Supabase: applies every migration from an empty database.
      # Only Postgres and Auth are needed for the tests.
      - name: Start Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP tests
        run: npx supabase test db
      - name: Lint SQL functions
        run: npx supabase db lint --level error --fail-on error
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  screens:
    name: Web build + screen tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
