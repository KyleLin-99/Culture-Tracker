# Regression tests. Runs on every pull request, every push to main, once a day,
# and on demand (Actions tab > CI > Run workflow). The daily run catches breakage
# from outside the repo (dependency releases, Supabase images) in quiet weeks.
# GitHub emails you when a scheduled run fails.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * *" # daily, 09:41 UTC (4:41 am Eastern)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fresh local Supabase: applies every migration from an empty database.
      # Only Postgres and Auth are needed for the tests.
      - name: Start Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP tests
        run: npx supabase test db
      - name: Lint SQL functions
        run: npx supabase db lint --level error --fail-on error
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  integration:
    name: Integration (real Supabase API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Database, API gateway, REST API and Auth: what the app talks to.
      - name: Start Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Connection settings found
        run: npx supabase status -o json | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(Object.keys(JSON.parse(s.slice(s.indexOf("{")))).join(", ")))'
      - name: Phone sync and offline queue against the real API
        run: npm run test:integration
      # The lab's MCP server: its own package. The integration test runs from the repo
      # root so it finds the local Supabase the same way the tests above do.
      - name: MCP server (types, unit, and against the real API)
        run: |
          npm ci --prefix mcp-server
          npm run --prefix mcp-server typecheck
          npm test --prefix mcp-server
          npm run --prefix mcp-server build
          mcp-server/node_modules/.bin/tsx --test mcp-server/test/server.int.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Screens against the real API
        run: npm run test:e2e:real
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-real
          path: |
            playwright-report-real/
            test-results/
          retention-days: 14
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  screens:
    name: Web build + screen tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
