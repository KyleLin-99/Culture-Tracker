# AI code review on every pull request, using Claude Code.
# Setup (once):
#   1. In Claude Code on your PC, run:  claude setup-token   (needs Claude Pro or Max)
#   2. GitHub repo > Settings > Secrets and variables > Actions > New secret
#      CLAUDE_CODE_OAUTH_TOKEN = the token from step 1
#   3. Install the Claude GitHub app on this repo (github.com/apps/claude),
#      or run /install-github-app inside Claude Code, which does 2 and 3 for you.
# Reviews follow the rules in CLAUDE.md. They comment; they never block a merge.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
